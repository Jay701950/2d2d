<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>QWER · 3D Model V7</title>
<style>
  :root { color-scheme: dark; --panel: rgba(30,32,35,.82); --line: rgba(255,255,255,.22); --muted:#bfc3c9; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000 !important; color:#f3f4f5; font-family:Inter, Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body.ui-hidden .topbar,
  body.ui-hidden .panel,
  body.ui-hidden .controls,
  body.ui-hidden .settings,
  body.ui-hidden .hint,
  body.ui-hidden .loading { display:none !important; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; outline:none; }
  .topbar { position:fixed; z-index:2; left:22px; top:18px; display:flex; align-items:center; gap:12px; pointer-events:none; }
  .mark { width:34px;height:34px;border:1px solid #777;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(145deg,#777,#292b2e);box-shadow:0 8px 30px #0008; }
  .heading { font-size:14px; font-weight:700; letter-spacing:.13em; }
  .sub { color:var(--muted); font-size:10px; margin-top:4px; letter-spacing:.14em; }
  .panel { position:fixed; z-index:2; left:22px; bottom:20px; padding:12px 14px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(18px); border-radius:14px; color:#c7c9cc; font-size:11px; line-height:1.65; box-shadow:0 12px 40px #0004; }
  .controls { position:fixed; z-index:3; right:22px; bottom:20px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100vw - 44px); }
  .settings { position:fixed; z-index:4; right:22px; bottom:76px; width:min(290px,calc(100vw - 28px)); padding:15px 16px 14px; border:1px solid var(--line); background:rgba(24,26,29,.92); backdrop-filter:blur(20px); border-radius:15px; color:#eef0f2; box-shadow:0 16px 48px #0008; }
  .settings[hidden] { display:none !important; }
  .settings-title { font-size:12px; font-weight:750; letter-spacing:.08em; margin-bottom:13px; }
  .setting-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:5px 12px; margin-top:12px; }
  .setting-label { color:#d7d9dc; font-size:11px; }
  .setting-value { color:#fff; font-size:11px; font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }
  .setting-row input[type=range] { grid-column:1 / -1; width:100%; margin:3px 0 0; accent-color:#d8dade; cursor:pointer; }
  .settings-note { margin-top:11px; color:#9da2a9; font-size:10px; line-height:1.5; }
  button { appearance:none; border:1px solid rgba(255,255,255,.17); color:#f4f5f6; background:rgba(35,37,40,.82); backdrop-filter:blur(15px); border-radius:11px; padding:10px 14px; font-size:12px; font-weight:600; cursor:pointer; transition:.18s ease; box-shadow:0 6px 20px #0003; }
  button:hover { background:#55595e; border-color:#aaa; transform:translateY(-1px); }
  button.active { background:#d7d9dc; color:#17191c; border-color:#fff; }
  .hint { position:fixed; right:22px; top:22px; z-index:2; color:#9ea2a8; font-size:10px; letter-spacing:.08em; text-align:right; pointer-events:none; }
  .loading { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:transparent; color:#777; font-size:12px; letter-spacing:.15em; transition:opacity .35s; }
  .loading.hide { opacity:0; pointer-events:none; }
  @media(max-width:600px) { .topbar{left:14px;top:14px}.panel{left:14px;bottom:14px;font-size:10px;padding:9px 11px}.controls{right:14px;bottom:14px;max-width:72%;gap:6px}.settings{right:14px;bottom:72px}button{padding:9px 11px;font-size:11px}.hint{right:14px;top:62px} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="topbar"><div class="mark">QW</div><div><div class="heading">QWER / DEVICE</div><div class="sub">MONOCHROME 3D RECONSTRUCTION</div></div></div>
<div class="hint">DRAG TO ROTATE&nbsp; · &nbsp;SCROLL TO ZOOM</div>
<div class="panel">REFERENCE RECONSTRUCTION<br>무광 회색 바디 · 전면 디스플레이 · 원형 조작부</div>
<section class="settings" id="settings" aria-label="회전 및 마우스 설정" hidden>
  <div class="settings-title">조작 감도 설정</div>
  <div class="setting-row">
    <label class="setting-label" for="rotationSpeed">자동 회전 속도</label>
    <output class="setting-value" id="rotationSpeedValue">1.0×</output>
    <input id="rotationSpeed" type="range" min="0.1" max="8" step="0.1" value="1" />
  </div>
  <div class="setting-row">
    <label class="setting-label" for="mouseSensitivity">마우스 회전 감도</label>
    <output class="setting-value" id="mouseSensitivityValue">1.0×</output>
    <input id="mouseSensitivity" type="range" min="0.2" max="3" step="0.1" value="1" />
  </div>
  <div class="settings-note">자동 회전은 회전 버튼의 속도, 마우스 감도는 드래그로 돌릴 때의 반응을 조절합니다.</div>
</section>
<div class="controls">
  <button id="front">정면</button><button id="back">후면</button><button id="spin" class="active">자동 회전</button><button id="reset">초기화</button><button id="settingsToggle" aria-expanded="false">설정</button><button id="hideUI">모델만 보기</button>
</div>
<div class="loading" id="loading">3D MODEL LOADING…</div>
<script>
  window.addEventListener('error', (event) => {
    const el = document.getElementById('loading');
    if (el && !el.classList.contains('hide')) el.innerHTML = '3D MODEL LOAD FAILED<br><small style="letter-spacing:0;color:#777">인터넷 연결과 WebGL 지원을 확인한 뒤 새로고침해 주세요.</small>';
  });
  window.addEventListener('unhandledrejection', () => {
    const el = document.getElementById('loading');
    if (el && !el.classList.contains('hide')) el.innerHTML = '3D MODEL LOAD FAILED<br><small style="letter-spacing:0;color:#777">인터넷 연결과 WebGL 지원을 확인한 뒤 새로고침해 주세요.</small>';
  });
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const host = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000); // Solid black background.
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 100);
camera.position.set(7.1, 5.2, 10.8);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setClearColor(0x000000, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.minDistance = 6;
controls.maxDistance = 19;
controls.maxPolarAngle = Math.PI * .88;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.rotateSpeed = 1.0;

scene.add(new THREE.HemisphereLight(0xcfd5df, 0x24262b, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 3.1); key.position.set(5,8,7); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=8;key.shadow.camera.bottom=-7; scene.add(key);
const fill = new THREE.DirectionalLight(0xaeb9ca, 1.2); fill.position.set(-6,3,-5); scene.add(fill);
const rim = new THREE.PointLight(0xffffff, 38, 18); rim.position.set(-3,4,5); scene.add(rim);

const matBody = new THREE.MeshStandardMaterial({color:0xb0b0ad, roughness:.78, metalness:.08});
const matEdge = new THREE.MeshStandardMaterial({color:0x858682, roughness:.68, metalness:.12});
const matLight = new THREE.MeshStandardMaterial({color:0xc9c9c5, roughness:.72, metalness:.08});
const matDark = new THREE.MeshStandardMaterial({color:0x555653, roughness:.82, metalness:.04});
const matScreen = new THREE.MeshStandardMaterial({color:0xffffff, roughness:.92, metalness:0});
const matBlack = new THREE.MeshStandardMaterial({color:0x17191a, roughness:.82, metalness:.02});
const matSilver = new THREE.MeshStandardMaterial({color:0xbfc0bc, roughness:.55, metalness:.18});
const device = new THREE.Group(); scene.add(device);

function rounded(w,h,d,r,x,y,z,mat,parent=device,segments=7){
  const geo = new RoundedBoxGeometry(w,h,d,segments,Math.min(r,Math.min(w,h,d)*.48));
  const mesh = new THREE.Mesh(geo,mat); mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh); return mesh;
}
function cylinder(radius,depth,x,y,z,mat,segments=64){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,depth,segments),mat);
  m.rotation.x=Math.PI/2; m.position.set(x,y,z); m.castShadow=true;m.receiveShadow=true;device.add(m);return m;
}
function torus(radius,tube,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.TorusGeometry(radius,tube,12,80),mat);
  m.position.set(x,y,z);m.castShadow=true;device.add(m);return m;
}
function lineBox(w,h,d,x,y,z,mat){return rounded(w,h,d,Math.min(w,h,d)*.25,x,y,z,mat);}

// Raised annular sector with open radial ends. Two sectors form the split lower dial.
function annularSegment(outerRadius, innerRadius, startAngle, endAngle, x, y, z, mat){
  const shape = new THREE.Shape();
  const steps = 64;
  shape.moveTo(outerRadius*Math.cos(startAngle), outerRadius*Math.sin(startAngle));
  for(let i=1;i<=steps;i++){
    const a=startAngle+(endAngle-startAngle)*i/steps;
    shape.lineTo(outerRadius*Math.cos(a), outerRadius*Math.sin(a));
  }
  shape.lineTo(innerRadius*Math.cos(endAngle), innerRadius*Math.sin(endAngle));
  for(let i=1;i<=steps;i++){
    const a=endAngle-(endAngle-startAngle)*i/steps;
    shape.lineTo(innerRadius*Math.cos(a), innerRadius*Math.sin(a));
  }
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape,{
    depth:.12, steps:1, bevelEnabled:true, bevelSegments:3,
    bevelThickness:.018, bevelSize:.018, curveSegments:32
  });
  const mesh = new THREE.Mesh(geometry,mat);
  mesh.position.set(x,y,z);
  mesh.castShadow=true; mesh.receiveShadow=true; device.add(mesh);
  return mesh;
}

// Main rounded housing. The front is +Z.
rounded(3.28,5.35,.82,.29,0,0,0,matBody);
// Subtle rear cover seam and small inset on the reverse.
rounded(2.78,4.86,.035,.22,0,0,-.425,matEdge);
rounded(2.70,4.78,.045,.20,0,0,-.451,matBody);
rounded(.72,.10,.035,.04,0,-2.23,-.48,matEdge);
// Soft raised shoulder around the upper attachment.
rounded(1.38,.27,.10,.12,0,2.55,.20,matLight);
rounded(.92,.20,.18,.08,0,2.62,.30,matEdge);
rounded(.78,.20,.20,.08,0,2.64,.36,matBody);

// Display frame: independent nested layers keep the borders crisp without z-fighting.
rounded(2.91,2.42,.14,.22,0,1.05,.445,matEdge);
rounded(2.81,2.32,.105,.19,0,1.05,.525,matLight);
rounded(2.53,2.03,.055,.10,0,1.05,.593,matDark);
rounded(2.44,1.94,.045,.075,0,1.05,.628,matScreen);

// Main display artwork. Keep all labels and the waveform comfortably inside the screen.
const displayCanvas=document.createElement('canvas'); displayCanvas.width=1024; displayCanvas.height=800;
const ctx=displayCanvas.getContext('2d');
const grad=ctx.createLinearGradient(0,0,0,800); grad.addColorStop(0,'#e5e5e2');grad.addColorStop(1,'#d5d6d2');ctx.fillStyle=grad;ctx.fillRect(0,0,1024,800);
ctx.strokeStyle='rgba(35,37,36,.22)';ctx.lineWidth=5;ctx.strokeRect(22,22,980,756);
ctx.fillStyle='#111313';ctx.font='bold 78px "Malgun Gothic", sans-serif';ctx.textAlign='left';ctx.fillText('평균',58,125);
// Waveform stays within a generous inset from all four edges.
ctx.beginPath();ctx.moveTo(58,326);ctx.lineTo(966,326);ctx.strokeStyle='rgba(25,27,26,.55)';ctx.lineWidth=7;ctx.stroke();
const wave=[
  [62,326],[100,318],[132,235],[156,220],[180,326],[214,344],[246,278],
  [274,288],[302,342],[338,326],[374,222],[398,218],[424,326],[458,344],
  [490,278],[518,288],[546,342],[582,326],[618,236],[642,224],[668,326],
  [702,342],[734,278],[762,290],[790,342],[826,326],[862,278],[890,288],
  [918,342],[962,326]
];
ctx.beginPath();ctx.moveTo(wave[0][0],wave[0][1]);
for(const p of wave.slice(1)) ctx.lineTo(p[0],p[1]);
ctx.strokeStyle='#101212';ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
ctx.fillStyle='#111313';ctx.font='bold 62px "Malgun Gothic", sans-serif';ctx.textAlign='left';ctx.fillText('포도당 수치',58,545);
ctx.textAlign='right';ctx.font='bold 104px Arial, sans-serif';ctx.fillText('000',862,555);
ctx.textAlign='left';ctx.font='bold 58px Arial,sans-serif';ctx.fillText('%',878,552);
ctx.textAlign='center';ctx.font='bold 128px "Malgun Gothic", sans-serif';ctx.fillText('정상',512,735);
const displayTexture=new THREE.CanvasTexture(displayCanvas);displayTexture.colorSpace=THREE.SRGBColorSpace;displayTexture.anisotropy=renderer.capabilities.getMaxAnisotropy();
const displayMat=new THREE.MeshStandardMaterial({map:displayTexture,roughness:.9,metalness:0});
const displayPlane=new THREE.Mesh(new THREE.PlaneGeometry(2.31,1.84),displayMat);displayPlane.position.set(0,1.05,.657);device.add(displayPlane);

// Narrow inset control strip beneath the screen.
rounded(2.82,.72,.13,.16,0,-.77,.45,matEdge);
rounded(2.70,.62,.10,.13,0,-.77,.525,matLight);
rounded(2.16,.39,.075,.075,0,-.77,.595,matEdge);
rounded(2.08,.31,.06,.055,0,-.77,.642,matBody);

// Live date/time is shown on the middle horizontal rectangle (YY/MM/DD/HH:MM).
const dateTimeCanvas=document.createElement('canvas');
dateTimeCanvas.width=1024; dateTimeCanvas.height=160;
const dateTimeCtx=dateTimeCanvas.getContext('2d');
function drawDateTime(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=`${pad(now.getFullYear()%100)}/${pad(now.getMonth()+1)}/${pad(now.getDate())}/${pad(now.getHours())}:${pad(now.getMinutes())}`;
  dateTimeCtx.clearRect(0,0,1024,160);
  const dateGrad=dateTimeCtx.createLinearGradient(0,0,0,160);
  dateGrad.addColorStop(0,'#e1e1de'); dateGrad.addColorStop(1,'#c9cac6');
  dateTimeCtx.fillStyle=dateGrad; dateTimeCtx.fillRect(0,0,1024,160);
  dateTimeCtx.textAlign='center';
  dateTimeCtx.textBaseline='middle';
  dateTimeCtx.fillStyle='#171918';
  dateTimeCtx.font='600 98px "Arial", "Malgun Gothic", sans-serif';
  dateTimeCtx.fillText(stamp,512,83,960);
  dateTimeTexture.needsUpdate=true;
}
const dateTimeTexture=new THREE.CanvasTexture(dateTimeCanvas);
dateTimeTexture.colorSpace=THREE.SRGBColorSpace;
const dateTimeMaterial=new THREE.MeshBasicMaterial({map:dateTimeTexture,transparent:true,depthWrite:false});
const dateTimePlane=new THREE.Mesh(new THREE.PlaneGeometry(1.94,.245),dateTimeMaterial);
dateTimePlane.position.set(0,-.77,.677);
device.add(dateTimePlane);
drawDateTime();

// Circular lower selector: split outer ring, with narrow openings at 12 and 6 o'clock.
// The two arc panels reproduce the reference's separated left/right ring pieces.
const dialY=-1.80, dialGap=.105;
annularSegment(.58,.345,-Math.PI/2+dialGap/2, Math.PI/2-dialGap/2,0,dialY,.49,matBody);
annularSegment(.58,.345, Math.PI/2+dialGap/2, 3*Math.PI/2-dialGap/2,0,dialY,.49,matBody);
// Enlarged inner circular press, still contained within the split outer dial.
torus(.350,.020,0,dialY,.615,matDark);
torus(.337,.010,0,dialY,.647,matSilver);
cylinder(.329,.09,0,dialY,.625,matLight);
cylinder(.320,.085,0,dialY,.685,matBody);
torus(.320,.013,0,dialY,.737,matEdge);

// Top vertical cap / clip module.
rounded(1.48,2.18,.58,.47,0,3.71,.00,matEdge);
rounded(1.39,2.08,.57,.43,0,3.73,.055,matLight);
// central vertical recessed channel and sliding latch
rounded(.62,1.57,.105,.14,0,3.70,.355,matEdge);
rounded(.48,1.43,.095,.10,0,3.68,.423,matDark);
rounded(.31,1.52,.12,.075,0,3.60,.49,matSilver);
rounded(.22,.30,.14,.045,0,4.34,.50,matBody);
// top rounded slot and two fork-like guides (the upper circular loop is removed)
rounded(.12,.52,.12,.035,-.19,4.02,.53,matLight);
rounded(.12,.52,.12,.035,.19,4.02,.53,matLight);
rounded(.18,.16,.13,.035,0,3.10,.52,matLight);
// long central tongue with narrow inset rails
rounded(.37,1.05,.13,.06,0,3.46,.57,matBody);
rounded(.055,.88,.025,.018,-.105,3.45,.643,matEdge);
rounded(.055,.88,.025,.018,.105,3.45,.643,matEdge);
// small rectangular bridge at the top of the clip
rounded(.70,.12,.10,.035,0,4.48,.43,matBody);

// Tiny mechanical side seam and a pair of side grooves visible at three-quarter angles.
rounded(.035,3.85,.018,.012,1.645,-.05,.02,matEdge);
rounded(.045,.62,.055,.02,1.64,-.78,.04,matDark);
rounded(.045,.62,.055,.02,-1.64,-.78,.04,matDark);

// No floor or backdrop geometry: the 3D device is isolated on transparency.

function setView(which){
  controls.autoRotate=false; document.getElementById('spin').classList.remove('active');
  if(which==='front') camera.position.set(0.25,1.35,12.8);
  else if(which==='back') camera.position.set(0.25,1.35,-12.8);
  controls.target.set(0,.55,0);controls.update();
}
document.getElementById('front').addEventListener('click',()=>setView('front'));
document.getElementById('back').addEventListener('click',()=>setView('back'));
document.getElementById('spin').addEventListener('click',e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)});
document.getElementById('reset').addEventListener('click',()=>{camera.position.set(7.1,5.2,10.8);controls.target.set(0,.55,0);controls.autoRotate=true;document.getElementById('spin').classList.add('active');controls.update()});

// Live controls for automatic orbit speed and pointer-drag sensitivity.
const settingsPanel = document.getElementById('settings');
const settingsToggle = document.getElementById('settingsToggle');
const rotationSpeed = document.getElementById('rotationSpeed');
const rotationSpeedValue = document.getElementById('rotationSpeedValue');
const mouseSensitivity = document.getElementById('mouseSensitivity');
const mouseSensitivityValue = document.getElementById('mouseSensitivityValue');
settingsToggle.addEventListener('click', () => {
  settingsPanel.hidden = !settingsPanel.hidden;
  settingsToggle.classList.toggle('active', !settingsPanel.hidden);
  settingsToggle.setAttribute('aria-expanded', String(!settingsPanel.hidden));
});
rotationSpeed.addEventListener('input', () => {
  controls.autoRotateSpeed = Number(rotationSpeed.value);
  rotationSpeedValue.value = `${controls.autoRotateSpeed.toFixed(1)}×`;
  rotationSpeedValue.textContent = rotationSpeedValue.value;
});
mouseSensitivity.addEventListener('input', () => {
  controls.rotateSpeed = Number(mouseSensitivity.value);
  mouseSensitivityValue.value = `${controls.rotateSpeed.toFixed(1)}×`;
  mouseSensitivityValue.textContent = mouseSensitivityValue.value;
});

// Hide every interface element so the viewer shows only the 3D model.
// Press Q at any time to toggle the interface back on or off.
function toggleUI(force){
  const hidden = typeof force === 'boolean' ? force : !document.body.classList.contains('ui-hidden');
  document.body.classList.toggle('ui-hidden', hidden);
  if (hidden) { settingsPanel.hidden = true; settingsToggle.classList.remove('active'); settingsToggle.setAttribute('aria-expanded', 'false'); }
  const button = document.getElementById('hideUI');
  if (button) button.textContent = hidden ? 'UI 표시' : '모델만 보기';
  return hidden;
}
document.getElementById('hideUI').addEventListener('click',()=>toggleUI(true));
addEventListener('keydown',event=>{
  if (event.key && event.key.toLowerCase() === 'q' && !event.repeat) {
    const tag = document.activeElement?.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !document.activeElement?.isContentEditable) toggleUI();
  }
});

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));}
addEventListener('resize',resize);
// Refresh the real device-local date/time shown on the middle strip.
setInterval(drawDateTime,1000);
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
document.getElementById('loading').classList.add('hide');
setTimeout(()=>document.getElementById('loading')?.remove(),450);
</script>
</body>
</html>
