
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 혈당 측정기</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #17191c;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#viewer {
  width: 100vw;
  height: 100vh;
}

.panel {
  position: fixed;
  top: 18px;
  left: 18px;
  padding: 15px 18px;
  border-radius: 16px;
  background: #ffffff12;
  backdrop-filter: blur(15px);
  border: 1px solid #ffffff20;
  z-index: 2;
}

.panel h3 {
  margin: 0 0 6px;
}

.panel p {
  font-size: 12px;
  color: #aaa;
  margin: 0;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 2;
}

button {
  border: 1px solid #ffffff30;
  background: #ffffff15;
  color: white;
  border-radius: 12px;
  padding: 12px 16px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  white-space: nowrap;
}

button:hover {
  background: #ffffff30;
}
</style>

<!-- OrbitControls 내부의 "three" import 경로 지정 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="viewer"></div>

<div class="panel">
  <h3>혈당 측정기</h3>
  <p>드래그하여 3D 모델 회전</p>
</div>

<div class="controls">
  <button onclick="resetView()">초기 시점</button>
  <button onclick="frontView()">정면</button>
  <button onclick="backView()">뒷면</button>
</div>

<script type="module">
import * as THREE from 'three';

import { OrbitControls } from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#17191c');

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 3, 190);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById('viewer').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(-50, 80, 100);
light.castShadow = true;
scene.add(light);

const fill = new THREE.DirectionalLight(0xffffff, 1.2);
fill.position.set(50, -30, -80);
scene.add(fill);

const device = new THREE.Group();
scene.add(device);

const gray = new THREE.MeshStandardMaterial({
  color: '#999b98',
  roughness: 0.72,
  metalness: 0.12
});

const grayLight = new THREE.MeshStandardMaterial({
  color: '#b8bab7',
  roughness: 0.62
});

const darkGray = new THREE.MeshStandardMaterial({
  color: '#686a67',
  roughness: 0.8
});

const black = new THREE.MeshStandardMaterial({
  color: '#111111',
  roughness: 0.4
});

function roundedShape(w, h, r) {
  const s = new THREE.Shape();

  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2);
  s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r);
  s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  s.lineTo(-w / 2 + r, h / 2);
  s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  s.lineTo(-w / 2, -h / 2 + r);
  s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);

  return s;
}

function roundedBox(w, h, d, r, material, x, y, z) {
  const geo = new THREE.ExtrudeGeometry(
    roundedShape(w, h, r),
    {
      depth: d,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.5,
      bevelThickness: 0.5,
      curveSegments: 12
    }
  );

  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z - d / 2);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  device.add(mesh);
  return mesh;
}

function box(w, h, d, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  device.add(mesh);
  return mesh;
}

function cylinder(radius, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, depth, 64),
    material
  );

  mesh.rotation.x = Math.PI / 2;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;

  device.add(mesh);
  return mesh;
}

// 본체
roundedBox(58, 105, 13, 8, gray, 0, -5, 0);

// 전면 테두리
roundedBox(49, 48, 1.8, 5, darkGray, 0, 19, 7.3);
roundedBox(46, 45, 1.4, 4, grayLight, 0, 19, 8.5);

// LCD 화면 텍스처
function createDisplayTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 984;
  canvas.height = 804;

  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 0, 804);
  gradient.addColorStop(0, '#eeeeeb');
  gradient.addColorStop(1, '#d9d9d6');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 984, 804);

  ctx.fillStyle = '#080808';

  // 평균
  ctx.font = '500 95px sans-serif';
  ctx.fillText('평균', 45, 120);

  // 파형
  ctx.beginPath();

  const startX = 270;
  const baseY = 270;

  ctx.moveTo(startX, baseY);

  const peaks = [
    [330, 40],
    [430, 160],
    [540, 30],
    [650, 120],
    [760, 160],
    [870, 190]
  ];

  let x = startX;

  for (const [px, py] of peaks) {
    ctx.bezierCurveTo(
      x + 25, baseY,
      px - 30, py,
      px, py
    );

    ctx.bezierCurveTo(
      px + 30, py,
      px + 45, baseY,
      px + 65, baseY
    );

    x = px + 65;
  }

  ctx.strokeStyle = '#050505';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();

  // 구분선
  ctx.fillStyle = '#777';
  ctx.fillRect(35, 300, 914, 8);

  // 포도당 수치
  ctx.fillStyle = '#050505';
  ctx.font = '500 88px sans-serif';
  ctx.fillText('포도당 수치', 45, 455);

  // 수치
  ctx.font = 'bold 150px monospace';
  ctx.fillText('000', 565, 450);

  ctx.font = 'bold 100px Arial';
  ctx.fillText('%', 855, 450);

  // 정상
  ctx.textAlign = 'center';
  ctx.font = 'bold 205px sans-serif';
  ctx.fillText('정상', 492, 710);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  return texture;
}

const displayTexture = createDisplayTexture();

const displayMaterial = new THREE.MeshStandardMaterial({
  map: displayTexture,
  roughness: 0.8
});

roundedBox(42, 40, 0.7, 3, grayLight, 0, 19, 9.5);

// LCD plane
const display = new THREE.Mesh(
  new THREE.PlaneGeometry(41, 39),
  displayMaterial
);

display.position.set(0, 19, 10.05);
device.add(display);

// 날짜 / 시간 LCD
roundedBox(47, 12, 1.5, 2, darkGray, 0, -31, 7.5);
roundedBox(42, 8.5, 0.7, 1.5, grayLight, 0, -31, 8.6);

// 시간 표시
const dateCanvas = document.createElement('canvas');
dateCanvas.width = 700;
dateCanvas.height = 150;

const dateCtx = dateCanvas.getContext('2d');

dateCtx.fillStyle = '#222';
dateCtx.font = 'bold 80px monospace';
dateCtx.textAlign = 'center';
dateCtx.fillText('10:00 | 10/30', 350, 105);

const dateTexture = new THREE.CanvasTexture(dateCanvas);
dateTexture.colorSpace = THREE.SRGBColorSpace;

const dateMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 8),
  new THREE.MeshBasicMaterial({
    map: dateTexture,
    transparent: true
  })
);

dateMesh.position.set(0, -31, 9.2);
device.add(dateMesh);

// 하단 원형 버튼
cylinder(14, 2, darkGray, 0, -43, 8.5);
cylinder(12.5, 2, gray, 0, -43, 10);
cylinder(9.5, 2, darkGray, 0, -43, 11.5);
cylinder(7.5, 2.2, grayLight, 0, -43, 12.8);

// 원형 링
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(10.5, 0.65, 16, 80),
  darkGray
);

ring.position.set(0, -43, 12);
device.add(ring);

// 위아래 홈
box(2.5, 5, 2, grayLight, 0, -30.5, 10.5);
box(2.5, 5, 2, grayLight, 0, -55.5, 10.5);

// 상단 측정 클립
roundedBox(25, 36, 12, 10, gray, 0, 64, 0);

// 클립 앞쪽 긴 스트립
roundedBox(9, 26, 2, 2, grayLight, 0, 61, 7);

// 클립 중앙 구조
roundedBox(12, 9, 2, 2, darkGray, 0, 76, 7.5);

// 안쪽 홈
box(5, 3, 1, black, 0, 76, 9);

// 클립의 돌출 프롱
for (const x of [-5, 0, 5]) {
  box(1.8, 12, 2, grayLight, x, 76, 9);
}

// 하단 연결부
roundedBox(18, 10, 12, 4, gray, 0, 47, 0);

// 본체와 클립 연결 브리지
roundedBox(18, 8, 13, 4, grayLight, 0, 46, 0);

// 카메라 제어
function resetView() {
  camera.position.set(0, 3, 190);
  controls.target.set(0, 0, 0);
  controls.update();
}

function frontView() {
  camera.position.set(0, 0, 190);
  controls.target.set(0, 0, 0);
  controls.update();
}

function backView() {
  camera.position.set(0, 0, -190);
  controls.target.set(0, 0, 0);
  controls.update();
}

window.resetView = resetView;
window.frontView = frontView;
window.backView = backView;

// 렌더링
function animate() {
  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene, camera);
}

animate();

// 화면 크기 변경 대응
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
